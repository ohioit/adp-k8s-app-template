name: release

on:
  workflow_dispatch:

  release:
    types:
      - released

jobs:{% for env in cookiecutter|k8s_environments if env.kind == "prod" %}
  deploy-{{ env.name }}:
    uses: OIT/ais-reusable-workflows/.github/workflows/release.yaml@main
    with:
      runner: {{ cookiecutter.team_name }}
      environment: {{ env.name }}
      skaffold_profile: {{ env.name }}
      argocd_token_key: {{ env.name }}
      argocd_project: {{ cookiecutter.team_name|lower }}-{{ env.argo_project }}
      target_cluster: {{ env.cluster_url }}
      target_namespace: {{ env.namespace }}
      {%- raw %}
      prerelease: ${{ github.event.release.prerelease }}
    secrets:
      artifactory_helm_repository: ${{ vars.ARTIFACTORY_HELM_REPOSITORY }}
      artifactory_username: ${{ vars.ARTIFACTORY_USERNAME }}
      artifactory_token: ${{ secrets.ARTIFACTORY_TOKEN }}
      {%- endraw %}
      github_pat: {{ "${{" }} secrets.{{ cookiecutter.team_name|upper }}_GITHUB_PAT {{ "}}" }}
      github_username: {{ "${{" }} vars.{{ cookiecutter.team_name|upper }}_GITHUB_SERVICE_ACCOUNT {{ "}}" }}
      argocd_server: {{ "${{" }} vars.{{ env.argo_server_var }}{{ "}}" }}
      argocd_tokens: {{ "${{" }} secrets.{{ cookiecutter.team_name|upper }}_ARGOCD_TOKENS {{ "}}" }}{% endfor %}
