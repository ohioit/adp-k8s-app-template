name: deploy

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'The environment to which a deployment should be done'
        required: true
      ref:
        description: 'The ref to deploy to the specified environment'
        required: false

jobs:
  {% for environment in cookiecutter.k8s_environments.split(",") if environment != cookiecutter.prod_environment %}
  deploy-{{ environment }}:
    uses: OIT/ais-reusable-workflows/.github/workflows/deploy.yaml@main
    if: ${{ "{{" }} github.event.inputs.env == '{{ environment|lower }}' {{ "}}" }}
    with:
      runner: {{ cookiecutter.team_name }}
      argocd_token_key: {{ environment|lower }}
      argocd_project: {{ cookiecutter.team_name|lower }}-{{ cookiecutter._k8s_environment_spec[environment|lower].argo_project }}
      target_cluster: {{ cookiecutter._k8s_cluster_details[cookiecutter[cookiecutter._k8s_environment_spec[environment|lower].clusters[0]]].url }}
      target_namespace: {% if cookiecutter.use_app_specific_namespace %}{{ cookiecutter.project_slug }}{% else %}{{ cookiecutter.team_name|lower }}-{{ environment|lower }}{% endif %}
      {%- raw %}
      skaffold_profile: ${{ github.event.inputs.env }}
      environment: ${{ github.event.inputs.env }}
      ref: ${{ github.event.inputs.ref }}
    secrets:
      artifactory_helm_repository: ${{ vars.ARTIFACTORY_HELM_REPOSITORY }}
      artifactory_username: ${{ vars.ARTIFACTORY_USERNAME }}
      artifactory_token: ${{ secrets.ARTIFACTORY_TOKEN }}
      {%- endraw %}
      github_pat: {{ "${{" }} secrets.{{ cookiecutter.team_name|upper }}_GITHUB_PAT {{ "}}" }}
      github_username: {{ "${{" }} vars.{{ cookiecutter.team_name|upper }}_GITHUB_SERVICE_ACCOUNT {{ "}}" }}
      argocd_server: {{ "${{" }} vars.{{ cookiecutter._k8s_environment_spec[environment|lower].argo_server_var }}{{ "}}" }}
      argocd_tokens: {{ "${{" }} secrets.{{ cookiecutter.team_name|upper }}_ARGOCD_TOKENS {{ "}}" }}
  {% endfor %}
