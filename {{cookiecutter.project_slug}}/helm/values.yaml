---
## This file contains all of the VALUES used in the templates that will be used
## to generate Kubernetes manifests. The structure of this is generally completely
## up to you, the developer. However, when you pull in a dependency, what they look
## for is up to them.
##
## Helm will automatically set the context of any dependency to start at the
## level with the dependency name, so if you pull in a dependency you call
## `mariadb` for example, all of the values for that dependency need to start
## at a level called `mariadb`, like this:

# mariadb:
#   values: for-mariadb
{%- if cookiecutter.deploy_3rdparty_chart %}

## Values for the upstream {{ cookiecutter.upstream_project_name }} chart go under its name.
{%- if cookiecutter.upstream_project_helm_documentation.strip()|length > 0 %}
## See {{ cookiecutter.upstream_project_helm_documentation }} for what it supports.
{%- endif %}

# {{ cookiecutter.upstream_project_name }}:
#   some: value
{%- endif %}

## There are a couple of conventions we like to setup for common use. Secrets:
secrets:
  ## Place all of your sealed secrets in here, start with the secret name
  ## without `-secret`, it'll be automatically appended. Then just do
  ## key: values, like this:

  # myapp:
  #   DB_USERNAME: <sealed value>
  #   DB_PASSWORD: <sealed value>

## Other things that are being generated by this chart and not by dependencies
## should be at the root level here.

## Here are some common fragments that are similar in many Helm charts:
#  ingress:
#    enabled: true
#    hosts:
#      - appname.cluster-env.k8s.example.com
#    tls:
#      - hosts:
#          - appname.cluster-env.k8s.example.com
