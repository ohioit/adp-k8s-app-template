## Configuration for the `skaffold` tool used primarily
## for running things from the command line.
#
## See https://skaffold.dev/docs/references/yaml/
## for details. Make sure to upgrade the version
## number as it may be very old. You can run `skaffold fix`
## to see if it can automate this for you.
apiVersion: skaffold/v4beta6
kind: Config
build:
  artifacts:
    - image: docker.registry.example.com/mw/demo-app-ui
  local:
    push: true

deploy:
  helm:
    releases:
      - name: mw-demo-app-ui
        chartPath: helm
        valuesFiles:
          - helm/values.yaml
        setValueTemplates:
          image: '{{ .IMAGE_FULLY_QUALIFIED_docker_registry_example_com_mw_demo_app_ui }}'
profiles:

  - name: dev
    deploy:
      kubeContext: k8s-sand
    patches:
      - op: add
        path: /deploy/helm/releases/0/valuesFiles/1
        value: helm/values/dev.yaml
      - op: add
        path: /deploy/helm/releases/0/namespace
        value: mw-dev
  - name: prod
    deploy:
      kubeContext: k8s-prod
    patches:
      - op: add
        path: /deploy/helm/releases/0/valuesFiles/1
        value: helm/values/prod.yaml
      - op: add
        path: /deploy/helm/releases/0/namespace
        value: mw-prod
